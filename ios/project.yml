name: Squared
options:
  bundleIdPrefix: tech.simplismart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NeoPop:
    url: https://github.com/CRED-CLUB/neopop-ios
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Squared:
    type: application
    platform: iOS
    sources:
      - path: Squared
    dependencies:
      - package: NeoPop
      - target: SquaredWidget
    entitlements:
      path: Squared/Resources/Squared.entitlements
      properties:
        com.apple.security.application-groups: [group.tech.simplismart.squared]
    info:
      path: Squared/Resources/Info.plist
      properties:
        CFBundleDisplayName: Squared
        CFBundleLocalizations: [en, hi]
        NSFaceIDUsageDescription: Unlock Squared with Face ID.
        NSCameraUsageDescription: Take a photo of a bill to attach it and read the total.
        NSPhotoLibraryUsageDescription: Attach a photo of a bill to an expense.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: tech.simplismart.squared
            CFBundleURLSchemes: [squared]
        LSApplicationQueriesSchemes: [upi, whatsapp, phonepe, gpay, paytmmp]
        RCAPIBaseURL: http://localhost:8080
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.simplismart.squared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
  SquaredWidget:
    type: app-extension
    platform: iOS
    sources: [SquaredWidget]
    entitlements:
      path: SquaredWidget/SquaredWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.tech.simplismart.squared]
    info:
      path: SquaredWidget/Info.plist
      properties:
        CFBundleDisplayName: Squared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.simplismart.squared.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
  SquaredTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SquaredTests]
    dependencies:
      - target: Squared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squared:
    build:
      targets:
        Squared: all
        SquaredTests: [test]
    test:
      targets: [SquaredTests]
