name: Squared
options:
  bundleIdPrefix: app.squared
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NeoPop:
    url: https://github.com/CRED-CLUB/neopop-ios
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Squared:
    type: application
    platform: iOS
    sources:
      - path: Squared
    dependencies:
      - package: NeoPop
      - target: SquaredWidget
    entitlements:
      path: Squared/Resources/Squared.entitlements
      properties:
        com.apple.security.application-groups: [group.app.squared.ios]
        com.apple.developer.associated-domains: ["applinks:$(SQUARED_LINK_DOMAIN)"]
    info:
      path: Squared/Resources/Info.plist
      properties:
        CFBundleDisplayName: Squared
        CFBundleLocalizations: [en, hi]
        NSFaceIDUsageDescription: Unlock Squared with Face ID.
        NSCameraUsageDescription: Take a photo of a bill to attach it and read the total.
        NSPhotoLibraryUsageDescription: Attach a photo of a bill to an expense.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.squared.ios
            CFBundleURLSchemes: [squared]
        LSApplicationQueriesSchemes: [upi, whatsapp, phonepe, gpay, paytmmp]
        RCAPIBaseURL: $(SQUARED_API_BASE_URL)
    settings:
      configs:
        # Set the production values once the domain is decided (docs/PRODUCTION.md, D4).
        # Release builds refuse to finish while they still say CHANGE-ME.
        Debug:
          SQUARED_API_BASE_URL: http://localhost:8080
          SQUARED_LINK_DOMAIN: localhost
        Release:
          SQUARED_API_BASE_URL: https://api.CHANGE-ME
          SQUARED_LINK_DOMAIN: CHANGE-ME
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squared.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    postBuildScripts:
      - name: Release checks
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then exit 0; fi
          case "$SQUARED_API_BASE_URL $SQUARED_LINK_DOMAIN" in
            *CHANGE-ME*) echo "error: set SQUARED_API_BASE_URL and SQUARED_LINK_DOMAIN for Release in ios/project.yml"; exit 1 ;;
          esac
          # local-network exception is for the dev stack only
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
  SquaredWidget:
    type: app-extension
    platform: iOS
    sources: [SquaredWidget]
    entitlements:
      path: SquaredWidget/SquaredWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.squared.ios]
    info:
      path: SquaredWidget/Info.plist
      properties:
        CFBundleDisplayName: Squared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.squared.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
  SquaredTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SquaredTests]
    dependencies:
      - target: Squared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Squared:
    build:
      targets:
        Squared: all
        SquaredTests: [test]
    test:
      targets: [SquaredTests]
